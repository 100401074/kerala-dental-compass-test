server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Clean URLs (allow /kochi to resolve to /kochi.html)
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Cache static assets
    location ~* \.(css|js|svg|woff2?|jpg|jpeg|png|gif|webp|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Cache HTML briefly so updates show up fast
    location ~* \.html$ {
        expires 5m;
        add_header Cache-Control "public, must-revalidate";
    }

    # No-cache for sitemap/robots
    location = /robots.txt { expires 1d; }
    location = /sitemap.xml { expires 1d; }
}
